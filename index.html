<style>
  :root {
    --bg: #0a0a0c;
    --panel: #161619;
    --muted: #9a9aa3;
    --red: #e0432b;
    --line: #2a2b32;
  }

    margin: 0; min-height: 100vh; background: var(--bg); color: #fff;

    max-width: 520px; text-align: center; padding: 48px 36px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .brand {
    font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 20px;
    letter-spacing: .02em; margin-bottom: 28px;
  }
  .brand span { color: var(--red); }
  h1 {
    font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 26px;
    line-height: 1.3; margin: 0 0 14px;
  }
  p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 26px; }
  a.btn {
    display: inline-block; background: var(--red); color: #fff; text-decoration: none;
    font-weight: 600; font-size: 15px; padding: 13px 26px; border-radius: 4px;
  }
  a.btn:hover { background: #c23620; }
